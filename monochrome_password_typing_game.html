<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL ACCESS</title>
    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --border: #ffffff;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- MONOCHROME CONTAINER --- */
        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 720px;
            background-color: var(--bg);
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .sys-id {
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-mono {
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 4px 12px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-mono:hover, .btn-mono:active {
            background: var(--fg);
            color: var(--bg);
        }

        /* --- MAIN CONTENT AREA --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .prompt-box {
            border: 1px solid var(--border);
            padding: 16px;
            text-align: center;
        }

        .prompt-title {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* --- INPUT FORM --- */
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid var(--border);
            padding: 14px 18px;
            background: var(--bg);
            transition: background-color 0.1s ease;
        }

        .input-wrapper.error-flash {
            background: var(--fg);
            color: var(--bg);
        }

        .input-wrapper.error-flash .password-input,
        .input-wrapper.error-flash .input-prompt {
            color: var(--bg);
        }

        .input-prompt {
            font-size: 1.2rem;
            font-weight: bold;
            margin-right: 12px;
        }

        .password-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .status-msg {
            font-size: 0.85rem;
            height: 20px;
            letter-spacing: 2px;
            text-align: center;
            font-weight: bold;
        }

        /* --- CLEAN MONOCHROME KEYBOARD --- */
        .keyboard-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid var(--border);
            padding: 12px;
            background: var(--bg);
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        .key {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: var(--font-mono);
            height: 48px;
            flex: 1;
            max-width: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.05s ease, color 0.05s ease;
        }

        .key-main {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .key.space-key {
            max-width: 280px;
        }

        .key.wide-key {
            max-width: 85px;
        }

        /* High Contrast Inversion on Press */
        .key:active, .key.pressed {
            background: var(--fg) !important;
            color: var(--bg) !important;
        }

        /* --- SUCCESS OVERLAY --- */
        .success-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border: 2px solid var(--border);
            padding: 24px;
            text-align: center;
        }

        .success-title {
            font-size: 1.4rem;
            font-weight: bold;
            background: var(--fg);
            color: var(--bg);
            padding: 6px 18px;
            letter-spacing: 4px;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 650px) {
            .app-container {
                padding: 12px;
                border-width: 1px;
            }
            header {
                margin-bottom: 12px;
                padding-bottom: 8px;
            }
            .sys-id {
                font-size: 0.75rem;
            }
            .key {
                height: 42px;
            }
            .key-main {
                font-size: 0.8rem;
            }
            .kb-row {
                gap: 3px;
            }
            .keyboard-wrapper {
                padding: 8px 4px;
            }
            .password-input {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="sys-id">SYSTEM://AUTHENTICATION</div>
        <div class="header-actions">
            <button class="btn-mono" id="soundBtn">AUDIO: OFF</button>
            <button class="btn-mono" id="resetBtn">CLEAR</button>
        </div>
    </header>

    <main>
        <!-- Clean Prompt -->
        <div class="prompt-box">
            <div class="prompt-title">ENTER PASSWORD</div>
        </div>

        <!-- Input Form -->
        <div class="input-form" id="formContainer">
            <div class="input-wrapper" id="inputWrapper">
                <span class="input-prompt">&gt;</span>
                <input 
                    type="text" 
                    class="password-input" 
                    id="passwordInput" 
                    placeholder="PASSWORD..." 
                    autocomplete="off" 
                    spellcheck="false" 
                    autofocus
                />
            </div>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <!-- Success Screen -->
        <div class="success-overlay" id="successOverlay">
            <div class="success-title">ACCESS GRANTED</div>
            <p>SYSTEM UNLOCKED.</p>
            <button class="btn-mono" id="restartBtn" style="margin-top: 10px; padding: 8px 20px;">RESET</button>
        </div>

        <!-- Clean On-Screen Keyboard -->
        <div class="keyboard-wrapper" id="keyboard">
            <div class="kb-row">
                <div class="key" data-key="Q"><span class="key-main">Q</span></div>
                <div class="key" data-key="W"><span class="key-main">W</span></div>
                <div class="key" data-key="E"><span class="key-main">E</span></div>
                <div class="key" data-key="R"><span class="key-main">R</span></div>
                <div class="key" data-key="T"><span class="key-main">T</span></div>
                <div class="key" data-key="Y"><span class="key-main">Y</span></div>
                <div class="key" data-key="U"><span class="key-main">U</span></div>
                <div class="key" data-key="I"><span class="key-main">I</span></div>
                <div class="key" data-key="O"><span class="key-main">O</span></div>
                <div class="key" data-key="P"><span class="key-main">P</span></div>
            </div>
            <div class="kb-row">
                <div class="key" data-key="A"><span class="key-main">A</span></div>
                <div class="key" data-key="S"><span class="key-main">S</span></div>
                <div class="key" data-key="D"><span class="key-main">D</span></div>
                <div class="key" data-key="F"><span class="key-main">F</span></div>
                <div class="key" data-key="G"><span class="key-main">G</span></div>
                <div class="key" data-key="H"><span class="key-main">H</span></div>
                <div class="key" data-key="J"><span class="key-main">J</span></div>
                <div class="key" data-key="K"><span class="key-main">K</span></div>
                <div class="key" data-key="L"><span class="key-main">L</span></div>
            </div>
            <div class="kb-row">
                <div class="key wide-key" data-key="BACKSPACE"><span class="key-main">DEL</span></div>
                <div class="key" data-key="Z"><span class="key-main">Z</span></div>
                <div class="key" data-key="X"><span class="key-main">X</span></div>
                <div class="key" data-key="C"><span class="key-main">C</span></div>
                <div class="key" data-key="V"><span class="key-main">V</span></div>
                <div class="key" data-key="B"><span class="key-main">B</span></div>
                <div class="key" data-key="N"><span class="key-main">N</span></div>
                <div class="key" data-key="M"><span class="key-main">M</span></div>
                <div class="key wide-key" data-key="ENTER"><span class="key-main">ENTER</span></div>
            </div>
            <div class="kb-row">
                <div class="key space-key" data-key=" "><span class="key-main">SPACE</span></div>
            </div>
        </div>
    </main>
</div>

<script>
    /* --- SILENT CAESAR CIPHER LOGIC (+3) --- */
    function caesarEncryptChar(char, shift = 3) {
        const code = char.charCodeAt(0);

        // English Uppercase (A-Z)
        if (code >= 65 && code <= 90) {
            return String.fromCharCode(((code - 65 + shift) % 26) + 65);
        }
        // English Lowercase (a-z)
        if (code >= 97 && code <= 122) {
            return String.fromCharCode(((code - 97 + shift) % 26) + 97);
        }
        // Russian Uppercase (А-Я)
        if (code >= 1040 && code <= 1071) {
            return String.fromCharCode(((code - 1040 + shift) % 32) + 1040);
        }
        // Russian Lowercase (а-я)
        if (code >= 1072 && code <= 1103) {
            return String.fromCharCode(((code - 1072 + shift) % 32) + 1072);
        }
        if (char === 'Ё') return 'В';
        if (char === 'ё') return 'в';

        return char;
    }

    /* --- MINIMAL AUDIO ENGINE --- */
    class MinimalAudio {
        constructor() {
            this.ctx = null;
            this.enabled = false;
        }

        init() {
            if (!this.ctx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContextClass();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        toggle() {
            this.init();
            this.enabled = !this.enabled;
            return this.enabled;
        }

        playKeyClick() {
            if (!this.enabled || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(800 + Math.random() * 200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.015);

            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.015);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.015);
        }

        playError() {
            if (!this.enabled || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, this.ctx.currentTime);

            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.15);
        }

        playSuccess() {
            if (!this.enabled || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }

    /* --- GAME LOGIC --- */
    const audio = new MinimalAudio();
    const TARGET_PASSWORD = 'EHDVW'; // Secret encrypted key

    // DOM Elements
    const passwordInput = document.getElementById('passwordInput');
    const inputWrapper = document.getElementById('inputWrapper');
    const statusMsg = document.getElementById('statusMsg');
    const keyboard = document.getElementById('keyboard');
    const soundBtn = document.getElementById('soundBtn');
    const resetBtn = document.getElementById('resetBtn');
    const formContainer = document.getElementById('formContainer');
    const successOverlay = document.getElementById('successOverlay');
    const restartBtn = document.getElementById('restartBtn');

    // Highlight key on pressed
    function highlightKey(key) {
        const upper = key.toUpperCase();
        let el = keyboard.querySelector(`[data-key="${upper}"]`);

        if (!el) {
            if (key === 'Backspace') el = keyboard.querySelector('[data-key="BACKSPACE"]');
            if (key === 'Enter') el = keyboard.querySelector('[data-key="ENTER"]');
        }

        if (el) {
            el.classList.add('pressed');
            setTimeout(() => el.classList.remove('pressed'), 120);
        }
    }

    // Password Check
    function checkPassword() {
        const value = passwordInput.value.trim().toUpperCase();

        if (value === TARGET_PASSWORD) {
            audio.playSuccess();
            formContainer.style.display = 'none';
            successOverlay.style.display = 'flex';
        } else {
            audio.playError();
            statusMsg.textContent = 'ACCESS DENIED';
            
            inputWrapper.classList.add('error-flash');
            setTimeout(() => inputWrapper.classList.remove('error-flash'), 200);
        }
    }

    // Append transformed key
    function appendKey(rawKey) {
        if (rawKey === 'Backspace') {
            passwordInput.value = passwordInput.value.slice(0, -1);
            statusMsg.textContent = '';
            return;
        }

        if (rawKey === 'Enter') {
            checkPassword();
            return;
        }

        if (rawKey.length === 1) {
            statusMsg.textContent = '';
            const encryptedChar = caesarEncryptChar(rawKey, 3);
            passwordInput.value += encryptedChar;
        }
    }

    // Physical Keyboard Handler
    passwordInput.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey || e.key === 'Tab') return;

        e.preventDefault();

        audio.playKeyClick();
        highlightKey(e.key);
        appendKey(e.key);
    });

    // Touch/Virtual Keyboard Handler
    keyboard.addEventListener('click', (e) => {
        const keyEl = e.target.closest('.key');
        if (!keyEl) return;

        audio.init();
        audio.playKeyClick();

        const keyVal = keyEl.getAttribute('data-key');
        highlightKey(keyVal);
        appendKey(keyVal);

        passwordInput.focus();
    });

    // Audio Toggle
    soundBtn.addEventListener('click', () => {
        const isOn = audio.toggle();
        soundBtn.textContent = `AUDIO: ${isOn ? 'ON' : 'OFF'}`;
    });

    // Reset Input
    resetBtn.addEventListener('click', () => {
        passwordInput.value = '';
        statusMsg.textContent = '';
        passwordInput.focus();
    });

    // Restart Level
    restartBtn.addEventListener('click', () => {
        passwordInput.value = '';
        statusMsg.textContent = '';
        formContainer.style.display = 'flex';
        successOverlay.style.display = 'none';
        passwordInput.focus();
    });

    // Keep focus
    document.addEventListener('click', (e) => {
        if (!e.target.closest('button')) {
            passwordInput.focus();
        }
    });

    window.onload = () => {
        passwordInput.focus();
    };
</script>
</body>
</html>
